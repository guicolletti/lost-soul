function mk(rows,pal){
  const h=rows.length,w=rows[0].length,c=document.createElement('canvas');
  c.width=w;c.height=h;const x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1);}}
  return c;
}
function flipped(src){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d');x.translate(src.width,0);x.scale(-1,1);x.drawImage(src,0,0);return c;}

/* ---------- Som (WebAudio, sem arquivos) ---------- */
let AC=null;
function beep(f,d,type='square',v=0.05,slide=0,delay=0){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}

function say(m,t=150){S.msg=m;S.msgT=t;}

function enterRoom(gx,gy,special){
  const k=special||gx+','+gy;
  // Rota Genocida: no lugar do Palco, só um vazio com uma alminha chorando
  const isVoid=k==='1,0'&&S.kills>=TOTAL_ENEMIES;
  const r=isVoid?ROOMS.void:ROOMS[k];
  if(!special){S.gx=gx;S.gy=gy;S.visited.add(k);}
  S.roomT=0;
  // orbes de agonia que ainda estavam voando entram direto ao trocar de sala
  while(S.agonyOrbs&&S.agonyOrbs.length){S.agonyOrbs.pop();S.agony++;}
  const g=[];
  for(let y=0;y<ROWS;y++){g.push([]);for(let x=0;x<COLS;x++){
    g[y].push(x>0&&x<COLS-1&&y>0&&y<ROWS-1?r.t[y-1][x-1]:'#');}}
  if(r.d.includes('U'))g[0][7]='.';
  if(r.d.includes('D'))g[ROWS-1][7]='.';
  if(r.d.includes('L')){g[4][0]='.';g[5][0]='.';}
  if(r.d.includes('R')){g[4][COLS-1]='.';g[5][COLS-1]='.';}
  if(k==='1,1')g[0][7]='G';
  if(PANELS[k]!==undefined)g[0][PANELS[k]]='K';
  ents=[];shots=[];orbs=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const ch=g[y][x];
    if('bvCHBMOSJ'.includes(ch)){g[y][x]='.';const id=k+':'+x+','+y;if('CMOSJ'.includes(ch)||!S.taken.has(id))spawn(ch,x*TS+8,y*TS+8,id);}
  }
  room={k,g,glitch:!!r.glitch,void:!!r.void,red:!!r.red,lock:false,name:r.name};room.bg=renderBg(g,room.glitch,room.void,room.red);
  room.corr=(room.glitch||room.void)?null:makeCorrosion(k,g);
}

function spawn(ch,x,y,id){
  const b={x,y,id,flash:0,hitCd:0,kb:0,kbx:0,kby:0};
  if(ch==='b')ents.push({...b,type:'blob',hp:3,hw:6,hh:5});
  if(ch==='v')ents.push({...b,type:'bat',hp:1,hw:5,hh:3,ang:Math.random()*6.28,t:0});
  if(ch==='M')ents.push({...b,type:'mask',npc:true,hw:7,hh:8});
  if(ch==='S')ents.push({...b,type:'soul',npc:true,hw:6,hh:7});
  if(ch==='O')ents.push({...b,type:'portal',npc:true,hw:5,hh:5});
  if(ch==='J')ents.push({...b,type:'gator',npc:true,hw:7,hh:7});
  if(ch==='C')ents.push({...b,type:'candle',lit:S.taken.has(id),hw:4,hh:5});
  if(ch==='H')ents.push({...b,type:'heart',pickup:true,hw:4,hh:3});
  if(ch==='B'&&!S.bossDead)ents.push({...b,id:null,type:'boss',hp:36,maxhp:36,hw:15,hh:12,active:false,t:0});
}

/* ---------- Colisão ---------- */
function solidAt(px,py){
  const tx=Math.floor(px/TS),ty=Math.floor(py/TS);
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return null;
  if(room.lock&&tx===7&&ty===ROWS-1)return true;
  const c=room.g[ty][tx];
  return c==='#'||c==='K'||c==='w'||(c==='G'&&S.candles<3);
}
function hitsWall(x,y,hw,hh,isEnemy){
  const pts=[[x-hw,y-hh],[x+hw-0.01,y-hh],[x-hw,y+hh-0.01],[x+hw-0.01,y+hh-0.01]];
  for(const [px,py] of pts){const s=solidAt(px,py);if(s===null){if(isEnemy)return true;}else if(s)return true;}
  return false;
}
function move(e,dx,dy,isEnemy){
  let blocked=false;
  if(!hitsWall(e.x+dx,e.y,e.hw,e.hh,isEnemy))e.x+=dx;else blocked=true;
  if(!hitsWall(e.x,e.y+dy,e.hw,e.hh,isEnemy))e.y+=dy;else blocked=true;
  return blocked;
}
const ov=(a,b)=>Math.abs(a.x-b.x)<a.hw+b.hw&&Math.abs(a.y-b.y)<a.hh+b.hh;

function burst(x,y,cols,n=10,spd=1.5,life=30){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*spd+0.3;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*(0.5+Math.random()*0.5),max:life,col:cols[i%cols.length]});}
}

function hurt(sx,sy){
  if(P.inv>0||S.mode!=='play')return;
  S.hp--;P.inv=70;S.shake=10;SFX.hurt();
  const a=Math.atan2(P.y-sy,P.x-sx);P.kbx=Math.cos(a)*2.2;P.kby=Math.sin(a)*2.2;P.kb=8;
  burst(P.x,P.y,['#e8344e','#ffffff'],8);
  if(S.hp<=0){S.mode='over';S.modeT=S.t;burst(P.x,P.y,['#2bb3a3','#e8742c','#ffd23f'],30,2,50);SFX.over();}
}

/* ---------- Atualização (60 fps fixo) ---------- */
function update(){
  S.t++;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=0.92;p.vy*=0.92;p.life--;}
  parts=parts.filter(p=>p.life>0);
  if(S.mode==='cutscene'){
    const c=S.cs;c.t++;
    if(K.atk)c.hold++;else c.hold=Math.max(0,c.hold-3);
    if(c.t>=240&&c.t<350&&(c.t%50===0||c.t%50===12))beep(55,0.18,'sine',0.12); // batimento do coração no zoom
    if(c.hold>=SKIP_HOLD||c.t>=CS_END){newGame();} // cutscene termina direto no jogo
    return;
  }
  if(S.mode!=='play'){
    // menu: só ENTER começa (Espaço não, pra não pular a cutscene sem querer)
    if(S.mode==='title'){if(JP.start){SFX.start();S={mode:'cutscene',t:0,cs:{t:0,hold:0}};parts=[];}}
    else if((JP.start||JP.atk)&&S.t-S.modeT>45){SFX.start();newGame();}
    return;
  }
  if(S.ui){updateLock();return;}
  if(S.dlg){updateDlg();return;}
  if(S.fadeIn>0)S.fadeIn--;
  if(S.pass){updatePass();return;}
  S.roomT++;if(S.msgT>0)S.msgT--;S.prompt='';
  if(S.think&&++S.think.t>220)S.think=null;
  if(S.agonyEndT&&S.t>=S.agonyEndT){S.agonyEndT=0;openDlg(AGONY_FULL_TEXT,null,{shake:true,speed:0.3});return;}
  // primeira sala com criaturas: ele estranha
  if(!S.metEnemies&&S.roomT===20&&ents.some(isTarget)){S.metEnemies=true;orbs=[];openDlg(FIRST_ENEMY_TEXT);return;}
  const holdFire=!S.metEnemies&&ents.some(isTarget); // não atira antes da fala da primeira sala

  // Jogadora
  const dx=(K.right?1:0)-(K.left?1:0),dy=(K.down?1:0)-(K.up?1:0);
  P.moving=!!(dx||dy);
  if(P.moving){P.fx=dx;P.fy=dy;} // 8 direções (usado se não houver inimigo por perto)
  if(dx)P.side=dx;
  let sp=1.25;if(dx&&dy)sp*=0.7071;
  if(P.kb>0){move(P,P.kbx,P.kby,false);P.kb--;}else move(P,dx*sp,dy*sp,false);
  if(P.cd>0)P.cd--;if(P.inv>0)P.inv--;
  // Lança uma bolinha de luz mirando sozinha no inimigo mais perto (segure para disparar sem parar)
  if((K.atk||JP.atk)&&P.cd===0&&!holdFire){
    let tx=P.fx,ty=P.fy,best=170;
    for(const e of ents){
      if(!isTarget(e))continue;
      const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<best){best=d;tx=e.x-P.x;ty=e.y-P.y;}
    }
    const n=Math.hypot(tx,ty)||1;
    orbs.push({x:P.x+tx/n*6,y:P.y-2+ty/n*6,vx:tx/n*2.6,vy:ty/n*2.6,hw:2,hh:2,life:80,dmg:0.75});
    P.cd=30;SFX.swing();
  }

  // Floresta Glitch: empurrar a árvore da borda por 3 segundos começa a atravessá-la
  if(room.glitch&&!room.red){
    const pushing=K.right&&P.x>=217&&Math.floor(P.y/TS)===FORCE_TREE[1];
    if(pushing){
      S.force=(S.force||0)+1;const f=S.force/180;
      if(S.force%14===0)beep(50+f*60,0.15,'sawtooth',0.03+f*0.04,-15);
      if(Math.random()<0.15+f*0.6)parts.push({x:224+Math.random()*3,y:P.y-8+Math.random()*16,vx:-Math.random()*0.7,vy:(Math.random()-0.5)*0.5,life:18,max:18,col:['#ff2a3a','#3f9cff','#6a0010','#d8f4ff'][Math.random()*4|0]});
      if(f>0.5)S.shake=Math.max(S.shake,1+(f*2|0));
      if(S.force>=180){S.force=0;S.pass={t:0};glitchSfx();S.shake=16;beep(45,0.9,'sawtooth',0.07,-10);}
    }else S.force=Math.max(0,(S.force||0)-3);
  }

  // Troca de sala
  if(P.x<0){enterRoom(S.gx-1,S.gy);P.x=236;return;}
  if(P.x>W){enterRoom(S.gx+1,S.gy);P.x=4;return;}
  if(P.y<0){enterRoom(S.gx,S.gy-1);P.y=156;return;}
  if(P.y>160){enterRoom(S.gx,S.gy+1);P.y=4;return;}

  // Painel-cadeado na parede de cima
  const pc=PANELS[room.k];
  if(pc!==undefined){
    const cx=pc*TS+8;
    if(S.glitchWall===room.k){if(Math.abs(P.x-cx)<9&&P.y<=23){enterGlitch(pc);return;}}
    else if(Math.abs(P.x-cx)<8&&P.y<26){S.prompt='?';if(JP.use||JP.start){S.ui={digits:[0,0,0,0],pos:0};S.typed='';return;}}
  }

  if(Math.random()<1/200+agonyMix()*0.07)parts.push({x:P.x+(Math.random()<0.5?-3:2),y:P.y,vx:0,vy:0.6,life:16,max:16,col:room.red?'#ff8a8a':'#7fd4ff'});
  const frozen=S.roomT<30;

  for(const e of ents){
    if(e.dead)continue;
    if(e.type==='mask'){
      if(Math.hypot(P.x-e.x,P.y-e.y)<24){S.prompt='E: olhar';if(JP.use||JP.start){openDlg(MASK_TEXT);return;}}
      continue;
    }
    if(e.type==='portal'){if(S.roomT>30&&ov(P,e)){if(room.red)backToGlitch();else leaveGlitch();return;}continue;}
    if(e.type==='gator'){
      if(Math.hypot(P.x-e.x,P.y-e.y)<24){S.prompt='E: falar';if(JP.use||JP.start){openDlg(GATOR_TEXT);return;}}
      continue;
    }
    if(e.type==='soul'){
      if(S.t%45===0)parts.push({x:e.x+(Math.random()<0.5?-3:2),y:e.y,vx:0,vy:0.5,life:22,max:22,col:'#7fd4ff'});
      if(Math.hypot(P.x-e.x,P.y-e.y)<26){S.prompt='E: ...';if(JP.use||JP.start){
        const h=Math.max(3,Math.min(5,S.max));S.route='Genocida · '+h+' corações';S.time=S.t;
        openDlg(ENDINGS[h+'-Genocida'],()=>{S.mode='win';S.modeT=S.t;beep(110,1.2,'triangle',0.06,-40);});return;}}
      continue;
    }
    if(e.type==='candle'){
      if(!e.lit&&Math.abs(P.x-e.x)<13&&Math.abs(P.y-e.y)<15){
        e.lit=true;S.taken.add(e.id);S.candles++;SFX.gem();
        burst(e.x,e.y-8,['#ffd23f','#ff7a1a','#ffffff'],16,1.2);
        if(S.candles>=3){say('O portão do Salão se abriu!',200);setTimeout(SFX.gate,500);}
        else say('Vela acesa! '+S.candles+'/3');
      }
      continue;
    }
    if(e.pickup){
      if(ov(P,e)){
        e.dead=true;
        if(e.id)S.taken.add(e.id);
        if(e.drop){S.hp=Math.min(S.max,S.hp+1);SFX.heal();}
        else{S.max=Math.min(5,S.max+1);S.hp=S.max;SFX.heal();say('Coração extra!');burst(e.x,e.y,['#e8344e','#ffffff'],14);}
      }
      continue;
    }
    if(e.flash>0)e.flash--;if(e.hitCd>0)e.hitCd--;
    if(e.kb>0){move(e,e.kbx,e.kby,true);e.kb--;}
    else if(!frozen)ai(e);

    if(!e.dead&&(e.type!=='boss'||e.active)&&ov(P,e))hurt(e.x,e.y);
  }

  for(const s of shots){
    s.x+=s.vx;s.y+=s.vy;s.life--;
    if(s.life<=0||s.x<0||s.y<0||s.x>W||s.y>160||solidAt(s.x,s.y)){s.dead=true;continue;}
    if(ov(P,s)){s.dead=true;hurt(s.x,s.y);}
  }
  const ak=agonyMix(),ORBC=[mixC([255,255,255],[200,150,255],ak,1),mixC([255,47,190],[90,20,150],ak,1),mixC([255,138,224],[60,10,100],ak,1)];
  for(const o of orbs){
    o.x+=o.vx;o.y+=o.vy;o.life--;
    if(S.t%2===0)parts.push({x:o.x,y:o.y,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,life:14,max:14,col:ORBC[1+(Math.random()*2|0)]});
    if(o.life<=0||solidAt(o.x,o.y)!==false){o.dead=true;burst(o.x,o.y,ORBC,6,1,14);continue;}
    for(const e of ents){
      if(e.dead||!isTarget(e))continue;
      if(ov(o,e)){o.dead=true;damage(e,o);break;}
    }
    if(o.dead)continue;
    for(const s of shots)if(!s.dead&&ov(o,s)){s.dead=true;o.dead=true;burst(o.x,o.y,ORBC.concat('#ff3355'),8,1.2,14);break;}
  }
  orbs=orbs.filter(o=>!o.dead);

  // Agonia: o orbe roxo escuro sobe, para e depois é puxado para o ursinho
  for(const a of S.agonyOrbs){
    a.t++;
    if(a.t<24){a.x+=a.vx;a.y+=a.vy;a.vx*=0.9;a.vy*=0.9;}
    else{const dx=P.x-a.x,dy=P.y-a.y,d=Math.hypot(dx,dy)||1,sp=Math.min(4,0.5+(a.t-24)*0.08);a.x+=dx/d*sp;a.y+=dy/d*sp;
      if(d<6){a.done=true;absorbAgony();}}
    if(S.t%3===0)parts.push({x:a.x,y:a.y,vx:0,vy:0,life:12,max:12,col:Math.random()<0.5?'#4a0f78':'#2a0640'});
  }
  S.agonyOrbs=S.agonyOrbs.filter(a=>!a.done);
  ents=ents.filter(e=>!e.dead);shots=shots.filter(s=>!s.dead);

  if(S.bossDead&&S.endT&&S.t>=S.endT&&S.mode==='play'&&!S.endingShown){
    S.endingShown=true;S.time=S.t;
    const h=Math.max(3,Math.min(5,S.max));
    const r=S.kills===0?'Pacifista':S.kills>=TOTAL_ENEMIES?'Genocida':'Neutra';
    S.route=r+' · '+h+' corações';
    openDlg(ENDINGS[h+'-'+r],()=>{S.mode='win';S.modeT=S.t;SFX.win();});
  }
}

function ai(e){
  const ddx=P.x-e.x,ddy=P.y-e.y,dist=Math.hypot(ddx,ddy)||1;
  if(e.type==='blob'){
    // se arrasta em "puxões" atrás da alma, deixando um rastro de gosma
    if(!e.ph)e.ph=Math.random()*6;
    if(dist<140){const pulse=Math.max(0,Math.sin(S.t*0.12+e.ph));const s=0.12+pulse*0.7;move(e,ddx/dist*s,ddy/dist*s,true);}
    else move(e,Math.sin(S.t*0.03+e.ph)*0.15,Math.cos(S.t*0.03+e.ph)*0.15,true);
    if(S.t%9===0)parts.push({x:e.x+(Math.random()-0.5)*8,y:e.y+e.hh,vx:0,vy:0,life:70,max:70,col:Math.random()<0.5?'#4a1a60':'#6b2d8f'});
  }else if(e.type==='bat'){
    if(--e.t<=0){e.t=30+Math.random()*40|0;
      e.ang=Math.random()<0.55?Math.atan2(ddy,ddx)+(Math.random()-0.5)*1.4:Math.random()*6.28;}
    if(move(e,Math.cos(e.ang)*0.95,Math.sin(e.ang)*0.95,true))e.ang+=1.6+Math.random();
  }else if(e.type==='boss'){
    if(!e.active){
      if(P.y<120){e.active=true;room.lock=true;S.shake=20;SFX.roar();say('A Raposa Destruída se levanta...',150);}
      return;
    }
    e.t++;
    const ph2=e.hp<=e.maxhp/2;
    // pelos e sangue escuro caindo do corpo machucado
    if(S.t%12===0)parts.push({x:e.x+(Math.random()-0.5)*26,y:e.y+(Math.random()-0.5)*18,vx:(Math.random()-0.5)*0.3,vy:0.4,life:40,max:40,col:Math.random()<0.5?'#6a0f1a':'#8a3e1a'});
    if(e.dash>0){ // investida
      e.dash--;if(move(e,e.dvx,e.dvy,true)){e.dash=0;S.shake=8;SFX.hit();}
      if(S.t%2===0)parts.push({x:e.x,y:e.y+10,vx:0,vy:0,life:20,max:20,col:'#4a565e'});
    }else if(e.wind>0){ // treme antes de avançar (aviso)
      e.wind--;
      if(e.wind%4===0)parts.push({x:e.x+(Math.random()-0.5)*30,y:e.y+10,vx:(Math.random()-0.5)*0.8,vy:-0.3-Math.random()*0.4,life:24,max:24,col:Math.random()<0.6?'#5a4a44':'#3a2a2a'});
      if(e.wind===0){e.dash=ph2?30:24;const sp=ph2?3:2.5;e.dvx=ddx/dist*sp;e.dvy=ddy/dist*sp;SFX.roar();}
    }else{
      const s=ph2?0.5:0.3;move(e,ddx/dist*s,ddy/dist*s,true);
      if(e.t%(ph2?140:200)===90){e.wind=45;beep(70,0.7,'sawtooth',0.06,40);beep(55,0.7,'square',0.03,20);} // rosnado
    }
    const period=ph2?75:110;
    if(e.t%period===0){
      const n=ph2?12:8,off=(e.t/period)*0.35;
      for(let i=0;i<n;i++){const a=off+i*6.283/n;shots.push({x:e.x,y:e.y,vx:Math.cos(a)*1.1,vy:Math.sin(a)*1.1,hw:3,hh:3,life:300});}
      SFX.shoot();
    }
    if(ph2&&e.t%45===20){shots.push({x:e.x,y:e.y,vx:ddx/dist*1.6,vy:ddy/dist*1.6,hw:3,hh:3,life:300});SFX.shoot();}
  }
}

function damage(e,o){
  e.hp-=o.dmg;e.flash=12;
  const a=Math.atan2(o.vy,o.vx),kp=e.type==='boss'?0.6:2;
  e.kbx=Math.cos(a)*kp;e.kby=Math.sin(a)*kp;e.kb=e.type==='boss'?4:8;
  const ak=agonyMix();
  SFX.hit();burst(o.x,o.y,[mixC([255,255,255],[200,150,255],ak,1),mixC([255,47,190],[90,20,150],ak,1),mixC([255,138,224],[60,10,100],ak,1)],8,1.4,18);
  if(e.hp<=0)kill(e);
}
function absorbAgony(){
  S.agony++;beep(90,0.35,'sawtooth',0.05,-30);beep(180,0.2,'triangle',0.03,-60,0.05);
  burst(P.x,P.y,['#4a0f78','#2a0640','#b07ae0'],8,1.2,20);
  if(KILL_LINES[S.agony])S.think={s:KILL_LINES[S.agony],t:0};
  if(S.agony>=TOTAL_ENEMIES){S.shake=36;S.think=null;S.agonyEndT=S.t+50;beep(50,1.2,'sawtooth',0.07,-20);}
}
function isTarget(e){return !(e.pickup||e.npc||e.type==='candle'||(e.type==='boss'&&!e.active));}

/* ---------- Diálogo ---------- */
function openDlg(lines,onEnd,opts={}){S.dlg={lines,i:0,c:0,onEnd,shake:!!opts.shake,speed:opts.speed||0.7};}
function updateDlg(){
  const d=S.dlg,line=d.lines[d.i];
  if(d.c<line.length){const before=d.c|0;d.c+=d.speed;if((d.c|0)!==before&&before%3===0&&line[before]!==' ')beep(480+Math.random()*80,0.03,'square',0.02);}
  if(JP.start||JP.use||JP.atk){
    if(d.c<line.length)d.c=line.length;
    else{d.i++;d.c=0;if(d.i>=d.lines.length){S.dlg=null;if(d.onEnd)d.onEnd();}}
  }
}

/* ---------- Cadeado ---------- */
function glitchSfx(){for(let i=0;i<10;i++)beep(150+Math.random()*1400,0.05,'square',0.04,0,i*0.04);}
function updateLock(){
  const u=S.ui;
  if(S.typed){for(const ch of S.typed){u.digits[u.pos]=+ch;u.pos=Math.min(3,u.pos+1);beep(620,0.05,'square',0.03);}S.typed='';}
  if(JP.left)u.pos=(u.pos+3)%4;
  if(JP.right)u.pos=(u.pos+1)%4;
  if(JP.up){u.digits[u.pos]=(u.digits[u.pos]+1)%10;beep(700,0.04,'square',0.03);}
  if(JP.down){u.digits[u.pos]=(u.digits[u.pos]+9)%10;beep(560,0.04,'square',0.03);}
  if(JP.back){S.ui=null;return;}
  if(JP.start||JP.use){
    const code=u.digits.join('');S.ui=null;
    if(code===SECRET_CODE){S.glitchWall=room.k;glitchSfx();S.shake=14;say('A parede começou a falhar...',160);}
    else{beep(110,0.25,'square',0.05);say('Nada acontece.',90);}
  }
}
function enterGlitch(pc){
  S.ret={gx:S.gx,gy:S.gy,pc};glitchSfx();S.shake=20;
  enterRoom(0,0,'glitch');P.x=120;P.y=96;say('...',120);
}
function leaveGlitch(){
  glitchSfx();const r=S.ret;enterRoom(r.gx,r.gy);P.x=r.pc*TS+8;P.y=44;
}
// atravessando a árvore: só anda enquanto segura pra direita, bem devagar
function updatePass(){
  const p=S.pass;p.t++;S.prompt='';
  P.moving=!!K.right;P.side=1;
  if(K.right){
    P.x+=0.08;

// Manchas de corrosão de cada sala (sempre iguais na mesma sala). Cada mancha tem um "limite":
// ela só aparece quando a Agonia passa desse limite, então o castelo vai apodrecendo aos poucos.
// Corrupção bloco a bloco: cada bloco (parede ou chão) tem um "limite" de Agonia.
// Paredes se corrompem primeiro, depois o chão perto delas, por último o meio da sala.
function makeCorrosion(key,g){
  let h=2166136261;for(const ch of key)h=Math.imul(h^ch.charCodeAt(0),16777619);
  const rnd=()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);return ((h^=h>>>16)>>>0)/4294967296;};
  const isWall=(x,y)=>x<0||y<0||x>=COLS||y>=ROWS||g[y][x]==='#'||g[y][x]==='K';
  const tiles=[];
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    const wall=isWall(tx,ty);
    const nearWall=!wall&&(isWall(tx-1,ty)||isWall(tx+1,ty)||isWall(tx,ty-1)||isWall(tx,ty+1));
    const th=wall?0.03+rnd()*0.5:nearWall?0.2+rnd()*0.55:0.35+rnd()*0.6;
    tiles.push({tx,ty,wall,th,r:[rnd(),rnd(),rnd(),rnd(),rnd(),rnd(),rnd(),rnd()]});
  }
  return tiles;
}
const corrC=document.createElement('canvas');corrC.width=W;corrC.height=160;const corrX=corrC.getContext('2d');let corrKey='';
function corrosionLayer(){
  const k=agonyMix(),key=room.k+':'+S.agony;
  if(key!==corrKey){
    corrKey=key;corrX.clearRect(0,0,W,160);
    for(const t of room.corr){
      if(t.th>=k)continue;
      const px=t.tx*TS,py=t.ty*TS,deep=Math.min(1,(k-t.th)/0.35),r=t.r;
      let s=(r[7]*1e6)|0;const lr=()=>((s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff); // aleatório fixo do bloco
      if(t.wall){
        // a parede escurece
        corrX.fillStyle=`rgba(4,0,8,${(0.4+0.5*deep).toFixed(2)})`;corrX.fillRect(px,py,16,16);
        // tijolos "escorregam": uma faixa da parede aparece deslocada, como imagem corrompida
        const sy=py+(r[0]*12|0),sh=2+(r[1]*3|0);
        corrX.save();corrX.filter='saturate(0.3) brightness(0.55)';
        corrX.drawImage(room.bg,px,sy,16,sh,px+Math.round((r[2]-0.5)*10*deep),sy,16,sh);corrX.restore();
        // rachadura descendo
        corrX.fillStyle='#000';let cx=px+(r[3]*14|0)+1,cy=py;
        for(let i=0;i<6+deep*10;i++){corrX.fillRect(cx,cy,1,1);cy++;if(lr()<0.4)cx+=lr()<0.5?-1:1;if(cy>=py+16)break;}
        // pedaços faltando (buracos pretos quadrados)
        if(deep>0.4){corrX.fillRect(px+(r[4]*12|0),py+(r[5]*12|0),3+(r[6]*3|0),3);}
        if(deep>0.8){corrX.fillRect(px+(lr()*12|0),py+(lr()*12|0),4,2);}
      }else{
        // o chão escurece
        corrX.fillStyle=`rgba(2,0,5,${(0.25+0.45*deep).toFixed(2)})`;corrX.fillRect(px,py,16,16);
        if(r[5]<0.22&&deep>0.6){
          // pior caso: o bloco vira um buraco de vazio com chiado
          corrX.fillStyle='#000';corrX.fillRect(px+1,py+1,14,14);
          for(let i=0;i<7;i++){corrX.fillStyle=lr()<0.5?'#2a0a3a':'#141018';corrX.fillRect(px+1+(lr()*13|0),py+1+(lr()*13|0),1+(lr()*2|0),1);}
        }else{
          // rachaduras e pixels mortos
          corrX.fillStyle='#000';let cx=px+(r[0]*16|0),cy=py+(r[1]*16|0);
          for(let i=0;i<4+deep*12;i++){corrX.fillRect(cx,cy,1,1);cx+=lr()<0.5?-1:1;if(lr()<0.5)cy+=lr()<0.5?-1:1;}
          if(deep>0.5){const sy=py+(r[2]*14|0);corrX.save();corrX.filter='brightness(0.5)';
            corrX.drawImage(room.bg,px,sy,16,2,px+Math.round((r[3]-0.5)*8),sy,16,2);corrX.restore();}
        }
      }
    }
  }
  return corrC;
}

// Holograma: copia o sprite linha por linha (algumas tremem pro lado = glitch), apaga linhas alternadas que rolam = scanlines
const holo=document.createElement('canvas');holo.width=16;holo.height=16;const hctx=holo.getContext('2d');
// Converte o sprite em "luz": miolo branco, bordas azuis, olhos viram buracos
function holoize(src,core='#ffffff'){
  const w=src.width,h=src.height,c=document.createElement('canvas');c.width=w;c.height=h;
  const sx=src.getContext('2d').getImageData(0,0,w,h).data,x=c.getContext('2d');
  const solid=(i,j)=>i>=0&&j>=0&&i<w&&j<h&&sx[(j*w+i)*4+3]>0&&sx[(j*w+i)*4]>20;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    if(!solid(i,j))continue;
    const edge=!solid(i-1,j)||!solid(i+1,j);const edge2=!solid(i-2,j)||!solid(i+2,j);
    x.fillStyle=edge?'#1f5fd8':edge2?'#5ab8ff':core;x.fillRect(i,j,1,1);
  }
  return c;
}
const HOLO=new Map([[SPR.cap,holoize(SPR.cap,'#a8dcff')]]); // gorro em azul-claro para destacar do corpo
// gl = intensidade do glitch (0 = quase nada, 1 = muito). Sem gl usa o glitch leve padrão.
function drawHolo(img,x,y,sc,gray=0,gl){
  if(!HOLO.has(img))HOLO.set(img,holoize(img));
  const hi=HOLO.get(img);
  hctx.globalCompositeOperation='source-over';hctx.clearRect(0,0,16,16);
  const g=gl===undefined?0.3:gl;
  const glitch=Math.random()<0.004+g*g*0.35;          // falha forte do quadro inteiro
  const rowP=glitch?0.5:g*g*0.15;                      // linhas que tremem sozinhas
  for(let r=0;r<hi.height;r++){
    let sx=0;
    if(Math.random()<rowP)sx=(Math.random()<0.5?-1:1)*(g>0.8&&Math.random()<0.5?2:1);
    hctx.drawImage(hi,0,r,hi.width,1,2+sx,1+r,hi.width,1);
  }
  // muito glitch: cópias coloridas deslocadas
  if(g>0.5&&Math.random()<(g-0.5)*1.2){
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.35;
    const d=(Math.random()<0.5?-1:1)*(1+(Math.random()*2|0))*sc;
    ctx.filter='hue-rotate(120deg)';ctx.drawImage(holo,x+d,y,16*sc,16*sc);
    ctx.filter='hue-rotate(-90deg)';ctx.drawImage(holo,x-d,y+(Math.random()<0.5?sc:0),16*sc,16*sc);
    ctx.filter='none';ctx.restore();
  }
  ctx.save();ctx.imageSmoothingEnabled=false;ctx.globalCompositeOperation='lighter';
  // brilho azul difuso por trás
  // gray (0..1): com a Agonia o holograma perde a cor e escurece até ficar cinza
  // na Floresta Vermelha o holograma fica vermelho
  const tone=(room&&room.red&&S.mode==='play'?' hue-rotate(150deg) saturate(1.4)':'')+(gray>0?` saturate(${(1-gray).toFixed(2)}) brightness(${(1-gray*0.45).toFixed(2)})`:'');
  ctx.globalAlpha=0.5*(1-gray*0.6);ctx.filter='blur('+(1.5*sc)+'px)'+tone;ctx.drawImage(hi,x+2*sc,y+sc,hi.width*sc,hi.height*sc);
  ctx.filter=tone||'none';ctx.globalAlpha=glitch?0.6:1;ctx.drawImage(holo,x,y,16*sc,16*sc);ctx.filter='none';ctx.restore();
}

  const rod=(col,o)=>{ctx.fillStyle=col;

function drawEnt(e){
  if(e.type==='mask'){
    const y=Math.round(e.y-8+Math.sin(S.t*0.05)*2);
    ctx.fillStyle='rgba(40,110,230,0.3)';ctx.beginPath();ctx.ellipse(e.x,e.y+10,8,2,0,0,7);ctx.fill();
    glitchDraw(SPR.mask,Math.round(e.x-7),y,0.12);return;
  }
  if(e.type==='gator'){drawGator(e);return;}
  if(e.type==='soul'){
    const y=Math.round(e.y-8+Math.sin(S.t*0.05)*1.5);
    ctx.globalAlpha=0.85;ctx.drawImage((S.t>>4)&1?SPR.soulB:SPR.soulA,Math.round(e.x-6),y);ctx.globalAlpha=1;
    // lágrimas escorrendo
    for(const [ex,ph] of [[3,0],[8,20]]){const k=((S.t+ph)%40)/40;ctx.fillStyle=`rgba(127,212,255,${1-k*0.7})`;ctx.fillRect(Math.round(e.x-6)+ex,y+8+Math.floor(k*6),1,2);}
    return;
  }
  if(e.type==='portal'){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=0;i<10;i++){const a=S.t*0.06+i*0.628,r=6+Math.sin(S.t*0.1+i)*1.5;
      ctx.fillStyle=i%2?'#ff2fbe':'#d8f4ff';ctx.fillRect(Math.round(e.x+Math.cos(a)*r),Math.round(e.y+Math.sin(a)*r*0.6),2,2);}
    ctx.restore();return;
  }
  const bob=Math.sin((S.t+e.x*3)*0.15);
  let img,sc=1,yo=0,xo=0,sxs=1,sys=1;
  switch(e.type){
    case 'blob':{img=(S.t>>4)&1?SPR.gooB:SPR.gooA;const q=Math.sin(S.t*0.12+(e.ph||0));sxs=1+q*0.18;sys=1-q*0.15;break;}
    case 'bat':img=SPR.bat;yo=bob*2-4;break;
    case 'candle':img=SPR.candle;yo=-3;
      if(e.lit){const f=(S.t>>2)&1;const fx=Math.round(e.x)-1,fy=Math.round(e.y-5+yo)-4;
        ctx.fillStyle='#ff7a1a';ctx.fillRect(fx,fy+f,3,4-f);ctx.fillStyle='#ffd23f';ctx.fillRect(fx+1,fy+1+f,1,2);}
      break;
    case 'heart':img=SPR.heart;yo=bob-1;break;
    case 'boss':{
      sc=2;
      const right=e.dash>0?e.dvx>0:P.x>e.x;
      if(!e.active){img=right?SPR.bossR:SPR.boss;yo=bob*1.5;break;}
      const fast=e.dash>0,fr=(S.t>>(fast?2:3))&1;
      img=fr?(right?SPR.foxRun2R:SPR.foxRun2):(right?SPR.foxRun1R:SPR.foxRun1);
      if(e.wind>0){ // carregando: agacha, treme cada vez mais forte e pisca
        img=right?SPR.foxRun1R:SPR.foxRun1;
        const a=1+(45-e.wind)/15;
        xo=Math.round((Math.random()*2-1)*a*1.5);yo=Math.round((Math.random()*2-1)*a);
        sys=0.82;sxs=1.12;
        if(e.wind%8<2)img=WHITE.get(img);
      }else if(fast){sxs=1.18;sys=0.9;}
      break;}
  }
  shadow(e.x,e.y+e.hh+1,e.hw+1);
  if(e.flash>0&&(e.flash&2))img=WHITE.get(img)||img;
  const dw=Math.round(img.width*sc*sxs),dh=Math.round(img.height*sc*sys);
  if(e.type==='boss'&&!e.active)ctx.globalAlpha=0.55;
  ctx.drawImage(img,Math.round(e.x-dw/2+xo),Math.round(e.y+img.height*sc/2-dh+yo),dw,dh);
  ctx.globalAlpha=1;
}

function wrapText(s,maxW){
  ctx.font='bold 8px monospace';const out=[];
  for(const para of s.split('\n')){
    let line='';
    for(const w of para.split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}
    out.push(line);
  }
  return out;
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  if(S.mode==='cutscene'){drawCutscene();return;}
  if(S.mode==='title'){drawTitle();return;}
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  let ox=0,oy=0;if(S.shake>0){ox=(Math.random()*4-2)|0;oy=(Math.random()*4-2)|0;S.shake--;}
  ctx.save();ctx.translate(ox,oy+HUD);
  // corrosão: com a Agonia o castelo perde a cor e vai ganhando manchas e rachaduras
  const ck=room.corr?agonyMix():0;
  if(ck>0)ctx.filter=`saturate(${(1-0.55*ck).toFixed(2)}) brightness(${(1-0.25*ck).toFixed(2)})`;
  ctx.drawImage(room.bg,0,0);ctx.filter='none';
  if(ck>0)ctx.drawImage(corrosionLayer(),0,0);
  if(room.red)drawLake();
  if(room.glitch)drawGlitchTrees();
  drawPanels();

  // Portão dos cristais / porta trancada do chefe
  if(room.k==='1,1'&&S.candles<3){
    ctx.fillStyle='#1a0f1f';ctx.fillRect(112,0,16,16);ctx.fillStyle='#ffd23f';
    for(let i=0;i<4;i++)ctx.fillRect(113+i*4,0,2,16);ctx.fillRect(112,7,16,2);
    for(let i=0;i<3;i++){ctx.fillStyle=i<S.candles?'#ff9a3a':'#2a1f38';ctx.fillRect(114+i*4,11,3,3);}
  }
  if(room.lock){ctx.fillStyle='#8a1c2b';for(let i=0;i<4;i++)ctx.fillRect(113+i*4,144,2,16);ctx.fillRect(112,150,16,2);}

  // Tochas
  for(const [x,y] of torches()){
    ctx.fillStyle='#5a3a1a';ctx.fillRect(x-1,y+2,2,5);
    const f=(S.t>>2)&1;ctx.fillStyle='#ff7a1a';ctx.fillRect(x-2,y-2+f,4,4);ctx.fillStyle='#ffd23f';ctx.fillRect(x-1,y-1+f,2,2);
  }

  const list=[...ents.map(e=>({y:e.y,f:()=>drawEnt(e)})),{y:P.y,f:drawPlayer}];
  if(S.mode==='over')list.pop();
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  // atravessando: a árvore fica por cima do ursinho, engolindo ele aos poucos
  if(S.pass){ctx.save();ctx.globalAlpha=Math.min(1,0.4+(P.x-219)/12);glitchDraw(SPR.tree,FORCE_TREE[0]*TS+((Math.random()*3|0)-1),FORCE_TREE[1]*TS,0.4);ctx.restore();}

  for(const s of shots){ctx.fillStyle='#ff3355';ctx.fillRect(Math.round(s.x)-3,Math.round(s.y)-3,6,6);ctx.fillStyle='#ffd0d8';ctx.fillRect(Math.round(s.x)-1,Math.round(s.y)-1,2,2);}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2);}
  ctx.globalAlpha=1;

  // Escuridão com luzes
  dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,W,160);
  dctx.fillStyle=room.red?'rgba(22,0,4,0.7)':room.glitch?'rgba(2,6,24,0.7)':room.void?'rgba(0,0,0,0.97)':'rgba(4,2,8,0.9)';dctx.fillRect(0,0,W,160);
  dctx.globalCompositeOperation='destination-out';
  if(S.mode!=='over'){const [lx,ly]=handLight();light(lx,ly,70+Math.sin(S.t*0.1)*3+Math.random()*2);}
  for(const [x,y] of torches())light(x,y+4,44+Math.random()*3);
  for(const e of ents){if(e.type==='candle')light(e.x,e.y-8,e.lit?40+Math.random()*3:12);if(e.type==='boss'&&e.active)light(e.x,e.y,36);}
  for(const s of shots)light(s.x,s.y,16);
  if(room.red)light(150,64,56);
  for(const e of ents){if(e.type==='gator'){light(e.x+6,e.y,40+Math.random()*2);light(e.x+33,e.y-12,26);}if(e.type==='soul')light(e.x,e.y,28+Math.sin(S.t*0.05)*3);if(e.type==='mask')light(e.x,e.y,46+Math.random()*4);if(e.type==='portal')light(e.x,e.y,22);}
  if(S.glitchWall===room.k&&PANELS[room.k]!==undefined)light(PANELS[room.k]*TS+8,8,30+Math.random()*8);
  for(const o of orbs)light(o.x,o.y,20);
  if(S.bossDead)light(120,80,200);
  ctx.drawImage(dark,0,0);
  // vermelho tomando a tela enquanto atravessa / ao chegar na Floresta Vermelha
  const redA=S.pass?Math.max(0,(P.x-219)/17)*0.85:S.fadeIn>0?S.fadeIn/60*0.85:0;
  if(redA>0){ctx.fillStyle=`rgba(110,0,12,${redA.toFixed(2)})`;ctx.fillRect(0,0,W,160);}
  if(ck>0){ // bordas roxas e a tela "rasgando" de vez em quando
    const vg=ctx.createRadialGradient(120,80,50,120,80,150);vg.addColorStop(0,'rgba(30,0,50,0)');vg.addColorStop(1,`rgba(30,0,50,${(0.6*ck).toFixed(2)})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,160);
    if(Math.random()<ck*ck*0.08){const y=Math.random()*150|0,h=(Math.random()*6+1)|0;ctx.drawImage(cv,0,y+HUD,W,h,((Math.random()-0.5)*10*ck)|0,y,W,h);}
  }
  for(const o of orbs)drawOrb(o);
  for(const a of S.agonyOrbs)drawAgony(a);

  // Barra de vida do chefe
  const boss=ents.find(e=>e.type==='boss'&&e.active);
  if(boss){ctx.fillStyle='#000';ctx.fillRect(60,148,120,6);ctx.fillStyle='#ff3355';ctx.fillRect(61,149,118*boss.hp/boss.maxhp,4);txt('RAPOSA DESTRUÍDA',120,138,'#ffe14a','center');}

  // pensamento em cima da cabeça, aparecendo letra por letra; vai ficando roxo com a Agonia
  if(S.think&&!S.dlg){
    const th=S.think,n=Math.min(th.s.length,Math.floor(th.t*0.5));
    ctx.globalAlpha=Math.min(1,(220-th.t)/30);
    txt(th.s.slice(0,n),Math.round(Math.max(40,Math.min(200,P.x))),Math.round(P.y-26),mixC([216,244,255],[190,130,240],agonyMix(),1),'center');
    ctx.globalAlpha=1;
  }
  if(S.prompt&&!S.ui&&!S.dlg&&(S.t>>4)&1)txt(S.prompt,Math.round(Math.max(30,Math.min(210,P.x))),Math.round(P.y+12),'#ffffff','center');
  if(S.msgT>0){ctx.globalAlpha=Math.min(1,S.msgT/30);txt(S.msg,120,boss?124:140,'#ffd23f','center');ctx.globalAlpha=1;}
  ctx.restore();
  drawHUD();
  if(S.ui)drawLock();
  if(S.dlg)drawDlg();

  if(S.mode==='over'||S.mode==='win'){
    const a=Math.min(0.75,(S.t-S.modeT)/60);
    ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,HUD,W,H-HUD);
    if(S.t-S.modeT>30){
      if(S.mode==='over'){txt('VOCÊ CAIU...',120,70,'#ff3355','center',16);}
      else{
        if((S.route||'').startsWith('Genocida'))txt('FIM.',120,58,'#8a2ad0','center',16);
        else txt('VITÓRIA!',120,58,'#ffd23f','center',16);
        txt('Rota '+(S.route||''),120,82,'#c9b8dd','center');
        const sec=Math.floor(S.time/60);txt('Tempo: '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'),120,96,'#8f7aa8','center');
      }
      if(S.t-S.modeT>45&&(S.t>>5)&1)txt('ENTER para jogar de novo',120,120,'#ffffff','center');
    }
  }
}

/* ---------- Cutscene de abertura ----------
   Linha do tempo (60 quadros = 1 segundo):
   0-300 quarto, dormindo | 300-420 glitch, a vela apaga | 420-480 escuro
   480-820 acorda no castelo, levanta, começa a chorar, a vela aparece */
const CUTSCENE_TEXT={sleep:'Era só mais uma noite...',fall:'...',wake:'Onde... eu estou?'};
const CS_END=610,SKIP_HOLD=50;
const csDarkC=document.createElement('canvas');csDarkC.width=W;csDarkC.height=H;const csd=csDarkC.getContext('2d');
let csCastleBg=null;
const CS_STARS=[[154,34],[160,52],[183,58],[176,35],[187,48],[157,40]];
function gridFor(k){
  const r=ROOMS[k],g=[];
  for(let y=0;y<ROWS;y++){g.push([]);for(let x=0;x<COLS;x++){
    let ch=x>0&&x<COLS-1&&y>0&&y<ROWS-1?r.t[y-1][x-1]:'#';if('bvCHBMOS'.includes(ch))ch='.';g[y].push(ch);}}
  return g;
}
function csLight(lights,alpha){
  csd.globalCompositeOperation='source-over';csd.clearRect(0,0,W,H);
  csd.fillStyle=`rgba(2,1,6,${alpha})`;csd.fillRect(0,0,W,H);csd.globalCompositeOperation='destination-out';
  for(const [x,y,r] of lights){const g=csd.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.5,'rgba(0,0,0,0.7)');g.addColorStop(1,'rgba(0,0,0,0)');
    csd.fillStyle=g;csd.beginPath();csd.arc(x,y,r,0,7);csd.fill();}
  ctx.drawImage(csDarkC,0,0);
}
function closedEyes(x,y,sc){ // tampa os olhos vazios e desenha um tracinho

  ctx.fillStyle='#2a6fe0';ctx.fillRect(x+5*sc,y+7*sc,2*sc,1);ctx.fillRect(x+9*sc,y+7*sc,2*sc,1);
}
function csCandle(x,y,lit,wild){
  ctx.fillStyle='#f1e6c8';ctx.fillRect(x,y,3,8);ctx.fillStyle='#c8952c';ctx.fillRect(x-2,y+8,7,2);
  if(!lit)return;
  const f=wild?(Math.random()*3|0):(S.t>>2)&1;
  ctx.fillStyle='#ff7a1a';ctx.fillRect(x,y-5+f,3,5-f);ctx.fillStyle='#ffd23f';ctx.fillRect(x+1,y-3+f,1,2);
}
function csBedroom(t){
  // parede, papel de parede e assoalho
  ctx.fillStyle='#1a1430';ctx.fillRect(0,0,W,120);ctx.fillStyle='#231a3a';for(let x=0;x<W;x+=24)ctx.fillRect(x,0,1,120);
  ctx.fillStyle='#120c1e';ctx.fillRect(0,120,W,H-120);ctx.fillStyle='#1d1530';for(let y=124;y<H;y+=8)ctx.fillRect(0,y,W,1);
  // janela com lua
  ctx.fillStyle='#3a2850';ctx.fillRect(146,26,48,42);ctx.fillStyle='#0b1430';ctx.fillRect(150,30,40,34);
  ctx.fillStyle='#d8f4ff';for(const [sx,sy] of CS_STARS)if(((t>>4)+sx)%5)ctx.fillRect(sx,sy,1,1);
  ctx.fillStyle='#e8f0ff';ctx.beginPath();ctx.arc(181,40,5,0,7);ctx.fill();ctx.fillStyle='#0b1430';ctx.beginPath();ctx.arc(183,38,4,0,7);ctx.fill();
  ctx.fillStyle='#3a2850';ctx.fillRect(169,30,2,34);ctx.fillRect(150,46,40,2);
  ctx.fillStyle='rgba(180,200,255,0.06)';ctx.beginPath();ctx.moveTo(150,64);ctx.lineTo(190,64);ctx.lineTo(214,150);ctx.lineTo(166,150);ctx.fill();
  // cama
  ctx.fillStyle='#5a3a2a';ctx.fillRect(26,74,8,62);ctx.fillStyle='#4a2e20';ctx.fillRect(26,112,114,16);
  ctx.fillRect(30,128,4,10);ctx.fillRect(134,128,4,10);
  ctx.fillStyle='#d8d0e8';ctx.fillRect(32,100,106,12);ctx.fillStyle='#f0ecf8';ctx.fillRect(36,90,28,11);
  // menino doente dormindo: pano na testa e o gorro de dormir
  const sick=t>240?Math.min(1,(t-240)/60):0; // durante o zoom ele piora
  const bx=38+(sick&&Math.random()<0.4?(Math.random()<0.5?-0.5:0.5):0),by=76; // tremendo de febre
  ctx.drawImage(SPR.boy,bx,by,24,20);ctx.drawImage(SPR.capCloth,bx,by-10,28,14);
  if(sick){
    ctx.fillStyle=`rgba(232,90,90,${0.55*sick})`;ctx.fillRect(bx+3,by+12,4,2);ctx.fillRect(bx+17,by+12,4,2); // febre
    ctx.fillStyle='#2a1a1a';ctx.fillRect(bx+6,by+9,4,1);ctx.fillRect(bx+16,by+9,4,1);                    // olhos apertados
    ctx.fillRect(bx+8,by+14,8,1);ctx.fillRect(bx+6,by+15,2,1);ctx.fillRect(bx+16,by+15,2,1);              // boca triste
  }
  // gotinhas de suor escorrendo (mais rápidas quando ele piora)
  for(const [dx,ph] of sick?[[21,0],[2,37]]:[[21,0]]){const p=((t+ph)%(sick?50:90))/(sick?50:90);
    if(p<0.7){ctx.fillStyle='rgba(170,220,255,0.9)';ctx.fillRect(bx+dx,by+10+Math.floor(p*10),1,2);}}
  // cobertor subindo e descendo com a respiração pesada (mais ofegante no zoom)
  const br=Math.round(Math.sin(t*(0.05+sick*0.1)));
  ctx.fillStyle='#3a4fa0';ctx.fillRect(40,94-br,100,18+br);ctx.fillStyle='#4a62c0';for(let i=0;i<5;i++)ctx.fillRect(48+i*18,98-br,8,8);
  ctx.fillStyle='#2a3a80';ctx.fillRect(40,110,100,2);
  // máscara de jacaré largada em cima do cobertor
  ctx.drawImage(SPR.gator,96,79-br,36,16);
  // criado-mudo com vela
  ctx.fillStyle='#5a3a2a';ctx.fillRect(158,100,30,5);ctx.fillStyle='#4a2e20';ctx.fillRect(160,104,26,30);
  const lit=true;
  csCandle(171,90,lit,t>240);
  // Zzz
  if(t<240)for(let i=0;i<3;i++){const p=((t+i*40)%120)/120;ctx.globalAlpha=(1-p)*0.9;txt('z',70+p*16+i*3,72-p*34,'#c9d8ff','left',6+i*2);}
  ctx.globalAlpha=1;
  const lights=[[176,46,44],[60,86,46],[112,88,30]];if(lit)lights.push([172,88,58+Math.random()*4]);
  csLight(lights,0.8);
}
// O castelo é desenhado igualzinho ao jogo (mesma posição e tamanho do ursinho),
// então quando a câmera termina de se afastar o jogo começa sem nenhum corte.
function csCastle(t){
  const k=t-400;
  if(!csCastleBg)csCastleBg=renderBg(gridFor('1,1'),false,false);
  ctx.drawImage(csCastleBg,0,16);
  for(const c of [3,11]){const x=c*TS+8,y=16+9;ctx.fillStyle='#5a3a1a';ctx.fillRect(x-1,y+2,2,5);const f=(S.t>>2)&1;
    ctx.fillStyle='#ff7a1a';ctx.fillRect(x-2,y-2+f,4,4);ctx.fillStyle='#ffd23f';ctx.fillRect(x-1,y-1+f,2,2);}
  // deitado de olhos fechados -> abre e pisca -> pulinho pra levantar -> a vela aparece
  const hop=k>=180&&k<200?Math.round(Math.sin((k-180)/20*Math.PI)*4):0;
  const bx=112,by=95-hop;
  ctx.fillStyle='rgba(40,110,230,0.35)';ctx.beginPath();ctx.ellipse(120,112,5,2,0,0,7);ctx.fill();
  drawHolo(SPR.bear,bx,by,1,0,0.05);drawHolo(SPR.cap,bx,by-4,1,0,0.05);
  const open=k>60&&!(k>72&&k<78)&&!(k>84&&k<88);
  if(!open)closedEyes(bx,by,1);
  if(open){ctx.save();ctx.globalCompositeOperation='lighter';
    for(const [ex,ph] of [[5,0],[10,45]]){const p=((t+ph)%90)/90;ctx.globalAlpha=0.3*(1-p*0.6);ctx.fillStyle='#bfe8ff';ctx.fillRect(bx+ex,by+8+Math.floor(p*4),1,2);}
    ctx.restore();}
  // a vela aparece no mesmo lugar onde ela fica no jogo
  if(k>=190){
    const cx=130,cy=102,f=(S.t>>2)&1;
    ctx.fillStyle='#f1e6c8';ctx.fillRect(cx,cy,2,4);ctx.fillStyle='#c8952c';ctx.fillRect(cx-1,cy+4,4,1);
    ctx.fillStyle='#ff7a1a';ctx.fillRect(cx,cy-3+f,2,3-f);ctx.fillStyle='#ffd23f';ctx.fillRect(cx,cy-2+f,1,1);
    if(k<206){ctx.fillStyle='#ffffff';for(let i=0;i<6;i++){const a=i*1.05+k*0.3,r=(206-k)*0.6;ctx.fillRect(Math.round(131+Math.cos(a)*r),Math.round(100+Math.sin(a)*r),1,1);}}
  }
  const r=k<190?26:Math.min(70,26+(k-190)*4);
  csLight([[k<190?120:131,100,r],[56,29,44+Math.random()*3],[184,29,44+Math.random()*3]],0.9);
}
function camAt(z,fx,fy,sx,sy){ctx.setTransform(z,0,0,z,sx-z*fx,sy-z*fy);} // ponto (fx,fy) aparece em (sx,sy) com zoom z
const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
function drawCutscene(){
  const t=S.cs.t;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(t<360){ // quarto: a câmera vai chegando no rosto do menino
    const e=ease((t-240)/110);camAt(1+3.5*e,50,88,50+70*e,88);csBedroom(t);
  }else if(t>=400){ // mesmo enquadramento, agora no castelo; depois a câmera se afasta
    const e=ease((t-500)/70);camAt(4.5-3.5*e,120,102,120,88+14*e);csCastle(t);
  }
  ctx.setTransform(1,0,0,1,0,0);
  // escurecer / clarear
  let fade=0;
  if(t<40)fade=1-t/40;else if(t>=330&&t<400)fade=Math.min(1,(t-330)/30);else if(t>=400&&t<430)fade=1-(t-400)/30;
  if(fade>0){ctx.fillStyle=`rgba(0,0,0,${Math.min(1,fade)})`;ctx.fillRect(0,0,W,H);}
  // legendas
  for(const [s,e,key] of [[40,220,'sleep'],[365,398,'fall'],[470,575,'wake']]){
    if(t>s&&t<e){ctx.globalAlpha=Math.max(0,Math.min(1,(t-s)/20,(e-t)/20));txt(CUTSCENE_TEXT[key],W/2,H-26,'#c9b8dd','center');ctx.globalAlpha=1;}
  }
  // pular
  ctx.font='bold 7px monospace';ctx.textAlign='right';ctx.textBaseline='top';ctx.fillStyle='rgba(143,122,168,0.85)';
  ctx.fillText('Segure ESPAÇO para pular',W-6,H-12);
  if(S.cs.hold>0){ctx.fillStyle='#3a2850';ctx.fillRect(W-96,H-4,90,2);ctx.fillStyle='#ffd23f';ctx.fillRect(W-96,H-4,Math.round(90*S.cs.hold/SKIP_HOLD),2);}
}

/* ---------- Loop ---------- */
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=STEP){update();for(const k in JP)JP[k]=false;acc-=STEP;}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
